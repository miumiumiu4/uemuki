# ストア版アプリ（iPhone・Android）が組み立てられるかを確かめる
name: アプリの組み立て
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-build.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node copy-web.mjs && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: uemuki-android-test
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node copy-web.mjs && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -30
