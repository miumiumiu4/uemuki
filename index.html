<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f8fd8">
  <meta name="description" content="みんなの一歩を応援し合う健康アプリ「うえむき」の見本">
  <title>うえむき</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="back" id="backBtn" aria-label="戻る" hidden>‹</button>
      <h1 id="title">みんなの一歩</h1>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="メニュー">
      <button data-tab="home" class="active"><span class="ti">⌂</span>ホーム</button>
      <button data-tab="body"><span class="ti">◎</span>からだ</button>
      <button data-tab="walk" class="walk"><span>歩く</span></button>
      <button data-tab="hints"><span class="ti">✦</span>ヒント</button>
      <button data-tab="me"><span class="ti">●</span>マイページ</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-body" role="dialog" aria-modal="true">
      <button class="sheet-close" data-close aria-label="閉じる">×</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
